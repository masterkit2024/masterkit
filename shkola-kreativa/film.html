<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="cues.js"></script><script src="film.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d', { alpha: false });
window.drawFrame = (f) => { FILM.render(ctx, f); return true; };
window.grab = (f, type) => { FILM.render(ctx, f); return document.getElementById('c').toDataURL(type || 'image/png'); };
</script></body></html>
