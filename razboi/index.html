<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разбой — ст. 192 УК РК</title>
<style>
@font-face{font-family:'PF';src:url(assets/pf-cyr.woff2) format('woff2');font-weight:400 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'PF';src:url(assets/pf-lat.woff2) format('woff2');font-weight:400 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'IN';src:url(assets/Inter-Regular.otf);font-weight:400}
@font-face{font-family:'IN';src:url(assets/Inter-Medium.otf);font-weight:500}
@font-face{font-family:'IN';src:url(assets/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:'IN';src:url(assets/Inter-Bold.otf);font-weight:700}
@font-face{font-family:'IN';src:url(assets/Inter-ExtraBold.otf);font-weight:800}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:auto}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// ============================================================ setup
const W = 1920, H = 1080, FPS = 60, FOC = 1000;
const main = document.getElementById('c');
const mctx = main.getContext('2d');
const work = document.createElement('canvas'); work.width = W; work.height = H;
let ctx = work.getContext('2d');
const acc = document.createElement('canvas'); acc.width = W; acc.height = H;
const actx = acc.getContext('2d');
let TL, ART, CAM = {x:0,y:0,z:-1000,roll:0,fz:0,dof:0,ly:0};

const GOLD = '#d9b36c', GOLD2 = '#f3d79a', WHITE = '#f2efe8', MUTED = '#8f98ab', RED = '#d0473b';

// ============================================================ math
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ss = k => { k = clamp(k); return k*k*(3-2*k); };
const eOut3 = k => { k = clamp(k); return 1 - Math.pow(1-k, 3); };
const eIn3 = k => { k = clamp(k); return k*k*k; };
const eIO3 = k => { k = clamp(k); return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2; };
const eOut5 = k => { k = clamp(k); return 1 - Math.pow(1-k, 5); };
const eOutBack = (k, s=1.6) => { k = clamp(k); const c3 = s+1; return 1 + c3*Math.pow(k-1,3) + s*Math.pow(k-1,2); };
const spring = k => { k = clamp(k); return 1 - Math.exp(-5.5*k) * Math.cos(9*k); };
const prog = (t, a, d) => clamp((t - a) / d);
const W2T = w => w < 32.42 ? w : w + 50.93;   // voice time -> film time
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function mixC(a, b, k){ return a.map((v,i)=>Math.round(lerp(v, b[i], k))); }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ============================================================ assets
const imgCache = new Map();
function loadImg(src){
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  imgCache.set(src, p);
  if (imgCache.size > 40) { const k = imgCache.keys().next().value; if (!k.includes('article')) imgCache.delete(k); }
  return p;
}
let ktkImg = null;
async function ktkFrame(t){
  const i = Math.max(0, Math.min(3055, Math.floor((t - TL.ktkStart) * FPS + 1e-6)));
  return loadImg('assets/ktk/' + String(i + 1).padStart(5, '0') + '.jpg');
}

// grain tiles
const grain = [];
for (let g = 0; g < 4; g++) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270;
  const x = c.getContext('2d'); const id = x.createImageData(480, 270);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 255; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  x.putImageData(id, 0, 0); grain.push(c);
}
// bokeh sprite
const bokeh = document.createElement('canvas'); bokeh.width = bokeh.height = 64;
{ const b = bokeh.getContext('2d'); const g = b.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,226,160,1)'); g.addColorStop(.35,'rgba(255,214,140,.55)'); g.addColorStop(1,'rgba(255,200,120,0)');
  b.fillStyle = g; b.fillRect(0,0,64,64); }
const dust = []; for (let i = 0; i < 170; i++) dust.push({x: hash(i)*4000, y: hash(i+500)*2600, z: hash(i+900)*3000, r: 2 + hash(i+77)*5, ph: hash(i+33)*6.28, sp: .3 + hash(i+12)});
const smallC = document.createElement('canvas'); smallC.width = 192; smallC.height = 108;
const sctx = smallC.getContext('2d');

// ============================================================ projection helpers
function proj(x, y, z){
  const d = z - CAM.z; if (d < 25) return null;
  const s = FOC / d;
  return {x: (x - CAM.x) * s, y: (y - CAM.y) * s + (CAM.ly || 0), s, d};
}
function nearFade(d){ return clamp((d - 40) / 260); }
function dofBlur(z){ return Math.min(16, Math.abs(z - CAM.fz) * (CAM.dof || 0)); }
function obj(x, y, z, alpha, fn, o = {}){
  if (alpha <= 0.003) return;
  const p = proj(x, y, z); if (!p) return;
  const a = alpha * nearFade(p.d); if (a <= 0.003) return;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.scale(p.s, p.s);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sc) ctx.scale(o.sc, o.sc);
  ctx.globalAlpha *= a;
  const b = (o.noDof ? 0 : dofBlur(z)) + (o.blur || 0);
  if (b > 0.6) ctx.filter = `blur(${b.toFixed(1)}px)`;
  fn(ctx, p);
  ctx.restore();
}
function font(c, size, fam='IN', weight=500, ls=0){ c.font = `${weight} ${size}px ${fam}`; c.letterSpacing = ls + 'px'; }
function txt(c, s, x, y, o = {}){
  font(c, o.size || 40, o.fam || 'IN', o.w || 500, o.ls || 0);
  c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'alphabetic';
  c.fillStyle = typeof o.color === 'function' ? o.color(c) : (o.color || WHITE);
  if (o.glow) { c.shadowColor = o.glowC || 'rgba(243,215,154,.55)'; c.shadowBlur = o.glow; }
  c.fillText(s, x, y);
  c.shadowBlur = 0;
}
function goldGrad(c, size){ const g = c.createLinearGradient(0, -size*.8, 0, size*.1); g.addColorStop(0,'#fff4da'); g.addColorStop(.55, GOLD2); g.addColorStop(1, '#b8873e'); return g; }
function whiteGrad(c, size){ const g = c.createLinearGradient(0, -size*.8, 0, size*.1); g.addColorStop(0,'#ffffff'); g.addColorStop(1, '#cfc8b8'); return g; }

// per-glyph fly-in in world space
const measureCache = new Map();
function glyphs(str, size, fam, w, ls){
  const key = str + size + fam + w + ls;
  if (measureCache.has(key)) return measureCache.get(key);
  font(ctx, size, fam, w, 0);
  const out = []; let x = 0;
  for (const ch of str) { const cw = ctx.measureText(ch).width; out.push({ch, x, w: cw}); x += cw + ls; }
  const r = {g: out, total: x - ls}; measureCache.set(key, r); return r;
}
function flyText(str, x, y, z, t, t0, o){
  const {size=100, fam='PF', w=900, ls=0, align='center', stg=.045, dur=.7, dz=-600, dy=0, rot=.25, ease=eOutBack, color=WHITE, alpha=1, glow=0, mblur=8} = o;
  const G = glyphs(str, size, fam, w, ls);
  const x0 = align === 'center' ? -G.total/2 : align === 'right' ? -G.total : 0;
  G.g.forEach((g, i) => {
    const p = prog(t, t0 + i*stg, dur); if (p <= 0) return;
    const e = ease(p);
    const sgn = (i % 2 ? 1 : -1);
    obj(x + x0 + g.x + g.w/2, y + dy*(1-e), z + dz*(1-e), alpha*clamp(p*3), c => {
      c.rotate(rot*sgn*(1-eOut3(p)));
      txt(c, g.ch, 0, 0, {size, fam, w, align:'center', color: color === 'gold' ? goldGrad(c,size) : color === 'white' ? whiteGrad(c,size) : color, glow});
    }, {blur: (1 - eOut3(p)) * mblur});
  });
}

// paragraph layout with timed words
const layCache = new Map();
function layout(text, size, fam, w, maxW, lh, align='left'){
  const key = [text,size,fam,w,maxW,lh,align].join('|');
  if (layCache.has(key)) return layCache.get(key);
  font(ctx, size, fam, w, 0);
  const sp = ctx.measureText(' ').width;
  const words = text.split(' ').map((s, i) => ({s, i, w: ctx.measureText(s).width}));
  const lines = [[]]; let lw = 0;
  for (const wd of words) {
    const add = (lines[lines.length-1].length ? sp : 0) + wd.w;
    if (lw + add > maxW && lines[lines.length-1].length) { lines.push([wd]); lw = wd.w; }
    else { lines[lines.length-1].push(wd); lw += add; }
  }
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, b) => a + b.w, 0) + sp*(ln.length-1);
    let x = align === 'center' ? -tw/2 : 0;
    ln.forEach(wd => { wd.x = x; wd.y = li*lh; x += wd.w + sp; });
  });
  const r = {words, lines: lines.length, h: lines.length*lh}; layCache.set(key, r); return r;
}
function wordTimes(lay, ws, we){
  const tot = lay.words.reduce((a, b) => a + b.s.length + 1, 0); let acc = 0;
  return lay.words.map(wd => { const t = ws + (we - ws) * acc / tot; acc += wd.s.length + 1; return t; });
}
function drawPara(c, lay, times, now, o){
  const {size=40, fam='IN', w=500, color=WHITE, hi=new Set(), hiColor=GOLD2, dim=1, under=true} = o;
  font(c, size, fam, w, 0); c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  lay.words.forEach((wd, k) => {
    const p = prog(now, times[k], .45); if (p <= 0) return;
    const e = eOut3(p);
    c.save(); c.globalAlpha *= clamp(p*2) * dim; c.translate(wd.x, wd.y + 22*(1-e));
    const isH = hi.has(k);
    c.fillStyle = isH ? hiColor : color;
    if (isH) { c.shadowColor = 'rgba(243,215,154,.45)'; c.shadowBlur = 18*clamp(p*2); }
    c.fillText(wd.s, 0, 0); c.shadowBlur = 0;
    if (isH && under) { const u = eIO3(prog(now, times[k] + .15, .45)); c.fillStyle = 'rgba(217,179,108,.85)'; c.fillRect(0, size*.18, wd.w*u, Math.max(2, size*.06)); }
    c.restore();
  });
}

// ============================================================ icons (100-unit box)
function icon(c, name, size, o = {}){
  const s = size / 100, lw = (o.lw || 4) / s;
  c.save(); c.scale(s, s);
  c.strokeStyle = o.color || GOLD2; c.fillStyle = o.fill || o.color || GOLD2; c.lineWidth = lw; c.lineJoin = 'round'; c.lineCap = 'round';
  if (o.glow) { c.shadowColor = 'rgba(243,215,154,.6)'; c.shadowBlur = o.glow; }
  if (o.p !== undefined && o.p < 1) { c.setLineDash([700*o.p, 700]); }
  const B = () => c.beginPath();
  switch (name) {
    case 'pin': B(); c.moveTo(0,46); c.bezierCurveTo(-8,28,-34,8,-34,-14); c.arc(0,-14,34,Math.PI,0); c.bezierCurveTo(34,8,8,28,0,46); c.stroke(); B(); c.arc(0,-14,11,0,7); c.stroke(); break;
    case 'person': B(); c.arc(0,-30,17,0,7); c.fill(); B(); c.moveTo(-34,46); c.bezierCurveTo(-34,0,-20,-6,0,-6); c.bezierCurveTo(20,-6,34,0,34,46); c.closePath(); c.fill(); break;
    case 'rifle': {
      const P = [[-50,-2],[-47,-9],[-22,-7],[-17,-10],[9,-10],[11,-7],[50,-7],[50,-3],[11,-3],[6,1],[-6,1],[-8,5],[-12,5],[-14,1],[-18,2],[-30,13],[-46,15],[-50,10]];
      B(); P.forEach((p,i)=> i? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1])); c.closePath();
      if (o.filled) c.fill(); else c.stroke();
      B(); c.arc(-10,4,5,0,Math.PI); c.stroke(); break; }
    case 'money':
      B(); c.roundRect(-34,-34,72,42,5); c.stroke();
      c.fillStyle = o.bg || '#0b0f16'; B(); c.roundRect(-42,-22,80,46,6); c.fill(); c.stroke();
      B(); c.arc(-2,1,12,0,7); c.stroke();
      c.fillStyle = o.color || GOLD2; font(c, 16, 'IN', 700); c.textAlign='center'; c.textBaseline='middle'; c.fillText('₸', -2, 2); break;
    case 'phone': B(); c.roundRect(-22,-42,44,84,9); c.stroke(); B(); c.moveTo(-8,-33); c.lineTo(8,-33); c.stroke(); B(); c.arc(0,32,3,0,7); c.fill(); break;
    case 'cuffs':
      B(); c.arc(-27,14,19,0,7); c.stroke(); B(); c.arc(27,14,19,0,7); c.stroke();
      B(); c.moveTo(-27,-5); c.lineTo(-27,-14); c.moveTo(27,-5); c.lineTo(27,-14); c.stroke();
      for (let i=0;i<4;i++){ B(); c.ellipse(-15+i*10,-18,6,4,0,0,7); c.stroke(); } break;
    case 'scales':
      B(); c.moveTo(0,-42); c.lineTo(0,40); c.moveTo(-24,42); c.lineTo(24,42); c.moveTo(-42,-30); c.lineTo(42,-30); c.stroke();
      for (const sx of [-1,1]) { B(); c.moveTo(sx*42,-30); c.lineTo(sx*42-14,6); c.moveTo(sx*42,-30); c.lineTo(sx*42+14,6); c.stroke(); B(); c.arc(sx*42,6,15,0,Math.PI); c.closePath(); c.stroke(); }
      B(); c.arc(0,-42,5,0,7); c.fill(); break;
    case 'doc':
      B(); c.moveTo(-30,-42); c.lineTo(14,-42); c.lineTo(30,-26); c.lineTo(30,42); c.lineTo(-30,42); c.closePath(); c.stroke();
      B(); c.moveTo(14,-42); c.lineTo(14,-26); c.lineTo(30,-26); c.stroke();
      for (const y of [-12,2,16,30]) { B(); c.moveTo(-18,y); c.lineTo(y===30?6:18,y); c.stroke(); } break;
    case 'gavel':
      c.save(); c.rotate(-.65); B(); c.roundRect(-34,-36,52,24,5); c.stroke(); B(); c.moveTo(-8,-12); c.lineTo(-8,34); c.stroke(); c.restore();
      B(); c.roundRect(-6,30,52,10,3); c.stroke(); break;
    case 'target':
      for (const r of [36,22,8]) { B(); c.arc(0,0,r,0,7); c.stroke(); }
      B(); c.moveTo(0,-46); c.lineTo(0,-28); c.moveTo(0,46); c.lineTo(0,28); c.moveTo(-46,0); c.lineTo(-28,0); c.moveTo(46,0); c.lineTo(28,0); c.stroke(); break;
    case 'door': B(); c.rect(-26,-46,52,92); c.stroke(); B(); c.arc(14,2,4,0,7); c.fill(); break;
    case 'arrow': B(); c.moveTo(-46,0); c.lineTo(42,0); c.moveTo(24,-16); c.lineTo(44,0); c.lineTo(24,16); c.stroke(); break;
    case 'diamond': B(); c.moveTo(-26,-14); c.lineTo(-14,-28); c.lineTo(14,-28); c.lineTo(26,-14); c.lineTo(0,26); c.closePath(); c.moveTo(-26,-14); c.lineTo(26,-14); c.stroke(); break;
  }
  c.restore();
}

// ============================================================ shared layers
function background(t, tint, beamA = 1, sway = 0){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#05070b'; ctx.fillRect(0,0,W,H);
  let g = ctx.createRadialGradient(W*.5, H*.28, 50, W*.5, H*.45, W*.75);
  g.addColorStop(0, 'rgba(32,42,62,1)'); g.addColorStop(.55, 'rgba(13,18,28,1)'); g.addColorStop(1, 'rgba(5,7,11,1)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if (beamA > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const bx = W/2 + 90*Math.sin(t*.17) + sway;
    g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(tint, .20*beamA)); g.addColorStop(.6, rgba(tint, .06*beamA)); g.addColorStop(1, rgba(tint, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(bx-170, -20); ctx.lineTo(bx+170, -20); ctx.lineTo(bx+720, H); ctx.lineTo(bx-720, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx-60, -20); ctx.lineTo(bx+60, -20); ctx.lineTo(bx+330, H); ctx.lineTo(bx-330, H); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}
function worldBegin(cam, shakeX = 0, shakeY = 0){
  CAM = cam;
  ctx.setTransform(1,0,0,1,W/2 + shakeX, H/2 + shakeY);
  if (cam.roll) ctx.rotate(cam.roll);
  ctx.globalAlpha = 1; ctx.filter = 'none';
}
function drawDust(t, alpha = 1, count = 170){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < count; i++) {
    const d = dust[i];
    const zr = ((d.z - CAM.z) % 3000 + 3000) % 3000 + 60; const z = CAM.z + zr;
    const xx = d.x + Math.sin(t*.3*d.sp + d.ph)*40; const yy = d.y - t*14*d.sp;
    const x = CAM.x + ((((xx - CAM.x) % 4000) + 4000) % 4000) - 2000;
    const y = CAM.y + ((((yy - CAM.y) % 2600) + 2600) % 2600) - 1300;
    const p = proj(x, y, z); if (!p) continue;
    const near = zr < 500;
    const r = Math.max(1.2, d.r * p.s * (near ? 6 : 1.4));
    const a = alpha * (near ? .10 : .55) * clamp(zr/200) * clamp((3000 - zr)/800) * (.55 + .45*Math.sin(t*1.3 + d.ph));
    if (a <= .01) continue;
    ctx.globalAlpha = a;
    ctx.drawImage(bokeh, p.x - r, p.y - r, r*2, r*2);
  }
  ctx.restore();
}
function floorGrid(yF, alpha, tint = [217,179,108]){
  ctx.save(); ctx.lineWidth = 1.2;
  const step = 260; const x0 = Math.floor((CAM.x - 3200)/step)*step;
  for (let x = x0; x <= CAM.x + 3200; x += step) {
    const a = proj(x, yF, Math.max(CAM.z + 60, -400)), b = proj(x, yF, 3400); if (!a || !b) continue;
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y); g.addColorStop(0, rgba(tint, .16*alpha)); g.addColorStop(1, rgba(tint, 0));
    ctx.strokeStyle = g; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (let z = -260; z <= 3400; z += step) {
    const a = proj(CAM.x - 3200, yF, z), b = proj(CAM.x + 3200, yF, z); if (!a || !b) continue;
    ctx.strokeStyle = rgba(tint, .13*alpha*clamp(1 - (z+260)/3700)); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
}
function glassPanel(c, x, y, w, h, o = {}){
  const r = o.r || 26;
  c.save();
  if (o.shadow !== false) { c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 50; c.shadowOffsetY = 24; }
  const g = c.createLinearGradient(x, y, x + w*.4, y + h);
  g.addColorStop(0, 'rgba(38,48,68,.82)'); g.addColorStop(1, 'rgba(12,16,24,.88)');
  c.fillStyle = g; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill();
  c.shadowBlur = 0; c.shadowOffsetY = 0;
  const gl = o.glow || 0;
  c.strokeStyle = `rgba(217,179,108,${.22 + .6*gl})`; c.lineWidth = 2 + gl;
  if (gl > .05) { c.shadowColor = `rgba(243,215,154,${.5*gl})`; c.shadowBlur = 30*gl; }
  c.stroke(); c.shadowBlur = 0;
  const hl = c.createLinearGradient(x, y, x, y + h*.5); hl.addColorStop(0, 'rgba(255,255,255,.07)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.beginPath(); c.roundRect(x+2, y+2, w-4, h*.5, r); c.fill();
  c.restore();
}
function finish(t, o = {}){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(W/2, H/2, H*.35, W/2, H/2, H*1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function grainPass(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  ctx.drawImage(grain[Math.floor(t*24) % 4], 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}

// ============================================================ HUD + subtitles
const SECTIONS = {B:['01','Реальный случай'], D:['02','Понятие разбоя'], E:['03','Основные понятия'], F:['04','Статья 192 УК РК'], G:['05','Ответственность']};
function hud(t, key, a){
  if (!SECTIONS[key] || a <= 0) return;
  ctx.setTransform(1,0,0,1,0,0); ctx.save(); ctx.globalAlpha = a * .9;
  ctx.fillStyle = GOLD; ctx.fillRect(70, 62, 3, 40);

// ============================================================ scene windows / transitions
function sceneAlpha(key, t){
  const [s, e] = TL.scenes[key];
  const inA = key === 'A' ? 1 : key === 'C' ? clamp((t - s + .02)/.02) : key === 'H' ? ss((t - s - .45)/.6) : ss((t - s + .22)/.44);
  const outA = key === 'H' ? 1 : key === 'B' ? clamp((e + .02 - t)/.02) : key === 'G' ? clamp((e + .95 - t)/.6) : 1 - ss((t - e + .22)/.44);
  return Math.min(inA, outA);
}
function whip(t, key){ // camera z offset for dolly-through transitions
  const [s, e] = TL.scenes[key]; let dz = 0;
  if ('BDEFG'.includes(key)) dz -= 900 * (1 - eOut3(prog(t, s - .25, .85)));
  if ('ADEF'.includes(key)) dz += 1000 * eIn3(prog(t, e - .55, .8));
  return dz;
}

function drawCardQuad(i, alpha, yaw){

  ctx.save(); ctx.globalAlpha *= alpha;

    const a = pt(u0, 0), b = pt(u1, 0), c = pt(u0, 1), d = pt(u1, 1); if (!a || !b || !c || !d) continue;

      txt(k, S.num, 22, 0, {size: 118, fam: 'PF', w: 900, align: 'right', color: goldGrad(k, 118), glow: 26*hk + 10, glowC: rgba(tint, .7)});
      txt(k, 'лет', 34, 0, {size: 34, w: 700, align: 'left', color: WHITE});
    }, {blur: (1 - eOut3(np))*10});
  }
}
function sceneG(t, a){
  const w = t - 50.93; const c = camG(t); worldBegin(c); ctx.globalAlpha = a;
  const hk = heat(w); const tint = mixC([217,179,108], [214,70,52], hk);
  floorGrid(FLOOR, a, tint);
  drawDust(t, a);
  drawStairs(t, a, w);
  // header (world, high above)
  const ha = ss(prog(w, 96.3, .7)) * (1 - ss(prog(w, 126.6, .6)));
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = a*ha;
  txt(ctx, 'ЛИШЕНИЕ СВОБОДЫ', W/2, 160, {size: 22, w: 800, ls: 10, align: 'center', color: rgba(mixC([243,215,154], tint, .6), 1)});
  txt(ctx, 'с конфискацией имущества', W/2, 194, {size: 22, w: 500, ls: 1, align: 'center', color: MUTED});
}

// ============================================================ SCENE H — conclusion
function camH(t){
  const w = t - 50.93; const sh = Math.exp(-Math.max(0, w - 134.35)*6) * (w > 134.35 ? 1 : 0);
  return {x: 30*Math.sin(w*.22), y: 10*Math.sin(w*.3), z: -1150 + 150*ss(prog(w, 127, 18)) + 120*eIO3(prog(w, 144.6, 5)), roll: .007*Math.sin(w*.27) + .004*sh*Math.sin(w*70), fz: lerp(0, 0, 0), dof: .012, ly: 0,
          sx: sh*12*Math.sin(w*83), sy: sh*9*Math.cos(w*61)};
}
function sceneH(t, a){
  const w = t - 50.93; const c = camH(t); worldBegin(c, c.sx, c.sy); ctx.globalAlpha = a;
  drawDust(t, a);
  const p1out = ss(prog(w, 131.4, .8));
  flyText('Разбой —', 0, -150, 600*p1out, w, 127.6, {size: 96, fam: 'PF', w: 900, stg: .04, dur: .6, dz: -500, rot: .2, color: 'gold', alpha: a*(1 - p1out)});
  const lay1 = layout('серьёзное уголовное правонарушение', 72, 'PF', 700, 1600, 90, 'center');
  obj(0, -20, 600*p1out, a*(1 - p1out), k => drawPara(k, lay1, wordTimes(lay1, 128.6, 130.6), w, {size: 72, fam: 'PF', w: 700, color: WHITE, hi: new Set([0]), under: true}));
  // 15 years
  const p2out = eIO3(prog(w, 137.3, 1.2));
  const vis2 = ss(prog(w, 131.9, .5));
  obj(0, -330 + 0*p2out, 900*p2out, a*vis2*(1 - p2out*.85), k => txt(k, 'В КАЗАХСТАНЕ', 0, 0, {size: 26, w: 700, ls: 12, align: 'center', color: MUTED}));
  const cp = prog(w, 133.6, .8);
  if (cp > 0) {
    const n = Math.min(15, Math.round(lerp(3, 15, eOut3(cp))));
    const land = prog(w, 134.35, .5);
    obj(60, 70 - 80*p2out, 900*p2out, a*clamp(cp*3)*(1 - p2out*.8), k => {
      const s = 1 + .35*(1 - eOutBack(land, 2)); k.scale(s, s);
      txt(k, 'до', -260, -40, {size: 80, fam: 'PF', w: 700, align: 'right', color: WHITE});
      txt(k, String(n), 0, 60, {size: 400, fam: 'PF', w: 900, align: 'center', color: goldGrad(k, 400), glow: 50*clamp(land*2), glowC: 'rgba(230,120,70,.55)'});
      txt(k, 'ЛЕТ ЛИШЕНИЯ СВОБОДЫ', 0, 195, {size: 40, w: 800, ls: 12, align: 'center', color: WHITE});
    }, {blur: (1 - eOut3(cp))*8});
  }
  // closing message
  const p3out = ss(prog(w, 144.5, .6));
  const lay2 = layout('Насилие ради чужого имущества', 82, 'PF', 900, 1700, 100, 'center');
  obj(0, -80, 500*p3out - 100, a*(1 - p3out), k => drawPara(k, lay2, wordTimes(lay2, 139.0, 142.0), w, {size: 82, fam: 'PF', w: 900, color: WHITE, under: false}));
  const lay3 = layout('= серьёзная уголовная ответственность', 52, 'IN', 700, 1700, 70, 'center');
  obj(0, 30, 500*p3out - 100, a*(1 - p3out), k => drawPara(k, lay3, wordTimes(lay3, 142.2, 144.0), w, {size: 52, fam: 'IN', w: 700, color: GOLD2, hi: new Set([1,2,3]), hiColor: GOLD2, under: true}));
  // thanks
  flyText('Спасибо за внимание!', 0, -40, 0, w, 144.85, {size: 120, fam: 'PF', w: 900, stg: .035, dur: .7, dz: -600, rot: .2, color: 'white', alpha: a});
  const lp = eIO3(prog(w, 145.7, 1.0));
  obj(0, 30, 0, a*clamp(lp*3), k => { const g = k.createLinearGradient(-420,0,420,0); g.addColorStop(0,'rgba(217,179,108,0)'); g.addColorStop(.5,GOLD2); g.addColorStop(1,'rgba(217,179,108,0)'); k.fillStyle = g; k.fillRect(-420*lp, -1.5, 840*lp, 3); });
  obj(0, 100, 0, a*ss(prog(w, 146.0, .8)), k => { txt(k, TL.author, 0, 0, {size: 36, w: 600, align: 'center', color: WHITE}); txt(k, TL.group.toUpperCase(), 0, 44, {size: 22, w: 600, ls: 6, align: 'center', color: GOLD}); });
}

// ============================================================ frame
function tintFor(t){
  const w = t - 50.93;
  if (t >= TL.scenes.G[0] - .3) return mixC([217,179,108], [214,70,52], heat(w) * (1 - ss(prog(t, TL.scenes.H[0] - .2, 2.6))));
  return [217,179,108];
}
async function renderSample(t){
  ctx = work.getContext('2d');
  const inC = t >= TL.scenes.C[0] && t < TL.scenes.C[1];
  background(t, tintFor(t), inC ? 0 : 1);
  const keys = ['A','B','C','D','E','F','G','H'];
  let hudKey = null, hudA = 0;
  for (const k of keys) {
    const a = sceneAlpha(k, t); if (a <= 0.001) continue;
    if (k === 'A') sceneA(t, a);
    else if (k === 'B') sceneB(t, a);
    else if (k === 'C') await sceneC(t, a);
    else if (k === 'D') sceneD(t, a);
    else if (k === 'E') sceneE(t, a);
    else if (k === 'F') await sceneF(t, a);
    else if (k === 'G') sceneG(t, a);
    else if (k === 'H') sceneH(t, a);
    if (a > hudA) { hudA = a; hudKey = k; }
  }
  if (t > 31.2 && t < TL.ktkStart) await monitorFlyIn(t);
  finish(t);
  hud(t, hudKey, hudA * (hudKey === 'B' ? ss(prog(t, 14.3, .6)) * (1 - ss(prog(t, 31.0, .3))) : 1));
  subtitles(t);
  grainPass(t);
  // global fades
  const fin = ss(prog(t, 0, .6)), fout = 1 - ss(prog(t, TL.duration - 1.4, 1.3));
  const f = Math.min(fin, fout);
  if (f < 1) { ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0,0,W,H); }
}
// motion-blur sample count
const FAST = [[2.2, 3.2], [31.2, 32.45], [82.8, 83.9], [W2T(42.9), W2T(44.5)], [W2T(68.2), W2T(70)], [W2T(89.4), W2T(90.9)], [W2T(133.5), W2T(134.9)], [W2T(144.8), W2T(146)], [W2T(126.6), W2T(128.6)]];
function camAt(t){
  for (const [k, f] of [['A',camA],['B',camB],['D',camD],['E',camE],['F',camF],['G',camG],['H',camH]]) { const [s, e] = TL.scenes[k]; if (t >= s && t < e) return f(t); }
  return null;
}
function nSamples(t){
  const dt = 1/FPS; const a = camAt(t - dt/2), b = camAt(t + dt/2);
  let m = 0;
  if (a && b) { const s = FOC/Math.max(200, -a.z); m = (Math.abs(b.x - a.x) + Math.abs(b.y - a.y))*s + Math.abs(b.z - a.z)*.5 + Math.abs(b.roll - a.roll)*900; }
  for (const [s, e] of TL.scenes ? Object.values(TL.scenes) : []) { if (Math.abs(t - s) < .5 && s > 0) m = Math.max(m, 30); }
  for (const [s, e] of FAST) if (t >= s && t <= e) m = Math.max(m, 18);
  return Math.max(1, Math.min(7, Math.ceil(m/5)));
}
window.renderFrame = async function(i){
  const t = i / FPS;
  const n = nSamples(t);
  if (n === 1) { await renderSample(t); mctx.drawImage(work, 0, 0); return 1; }
  const shutter = .5 / FPS;
  for (let k = 0; k < n; k++) {
    const ts = t + (k/(n - 1) - .5) * shutter;
    await renderSample(ts);
    actx.globalAlpha = 1/(k + 1); actx.drawImage(work, 0, 0);
  }
  mctx.drawImage(acc, 0, 0);
  return n;
};
window.ready = (async () => {
  TL = await (await fetch('timeline.json')).json();
  await Promise.all(['900 40px PF','700 40px PF','400 40px IN','500 40px IN','600 40px IN','700 40px IN','800 40px IN'].map(f => document.fonts.load(f, 'АБВабв123')));
  await loadImg('assets/article.jpg');
  return TL.duration;
})();
</script>
