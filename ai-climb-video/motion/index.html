<script>
// preview: ?t=12.3 renders one frame; ?play plays in real time
const q = new URLSearchParams(location.search);
READY.then(() => {
  if (q.has('play')) { const t0 = performance.now() - (+q.get('play') || 0) * 1000; const loop = () => { renderAt((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
  else renderAt(+(q.get('t') || 0));
});
</script>
